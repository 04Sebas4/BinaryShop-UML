<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BinaryShop - Administración</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="admin.html">Binary<span>Shop</span></a>
    <a class="enlace" href="admin.html">Administración</a>
    <span id="usuario-nombre" class="usuario"></span>
    <button type="button" id="btn-salir" class="sec">Salir</button>
  </header>

  <main class="contenedor">
    <h2>Panel de administrador</h2>

    <div class="card">
      <h3>Usuarios</h3>
      <div class="tabla-wrap">
        <table>
          <thead><tr><th>Nickname</th><th>Nombre</th><th>Rol</th><th></th></tr></thead>
          <tbody id="usuarios"></tbody>
        </table>
      </div>
      <p id="sin-usuarios" class="vacio" hidden>No hay otros usuarios.</p>
    </div>

    <div class="card" style="margin-top:1rem">
      <h3>Productos publicados</h3>
      <div class="tabla-wrap">
        <table>
          <thead><tr><th></th><th>Producto</th><th>Precio</th><th>Vendedor</th><th></th></tr></thead>
          <tbody id="productos"></tbody>
        </table>
      </div>
      <p id="sin-productos" class="vacio" hidden>No hay productos.</p>
    </div>
  </main>

  <script src="../js/clases.js"></script>
  <script src="../js/comun.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
